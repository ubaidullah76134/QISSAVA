<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - QISSAVA</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>


<header class="reset-header">

    <a
        href="login.html"
        class="reset-back"
    >
        🔙
    </a>

    <div class="reset-header-title">
        Reset Password
    </div>

</header>



<main class="reset-container">

    <div class="reset-card">


        <div class="reset-logo">

            <img
                src="images/qissava-logo.png"
                alt="QISSAVA"
            >

        </div>


        <h1>
            Create New Password
        </h1>


        <p class="reset-subtitle">
            Enter your new password below.
        </p>



        <form id="resetForm">


            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="New password"
                minlength="6"
                required
            >


            <label for="confirmNewPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmNewPassword"
                placeholder="Confirm password"
                minlength="6"
                required
            >


            <button
                type="submit"
                class="reset-submit"
            >
                Reset Password
            </button>

        </form>


    </div>

</main>



<script>

const resetForm =
    document.getElementById("resetForm");


resetForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const newPassword =
            document
                .getElementById("newPassword")
                .value;


        const confirmPassword =
            document
                .getElementById(
                    "confirmNewPassword"
                )
                .value;


        if (
            newPassword.length < 6
        ) {

            alert(
                "Password kam az kam 6 characters ka hona chahiye."
            );

            return;

        }


        if (
            newPassword !==
            confirmPassword
        ) {

            alert(
                "Passwords match nahi kar rahe."
            );

            return;

        }


        const email =
            localStorage.getItem(
                "qissavaResetEmail"
            );


        if (!email) {

            alert(
                "Reset request expire ho gayi."
            );

            window.location.href =
                "forgot-password.html";

            return;

        }


        let users = [];

        try {

            users =
                JSON.parse(
                    localStorage.getItem(
                        "qissavaUsers"
                    )
                ) || [];

        } catch(error) {

            users = [];

        }


        const userIndex =
            users.findIndex(
                function(user) {

                    return (
                        user.email ===
                        email
                    );

                }
            );


        if (userIndex === -1) {

            alert(
                "User account nahi mila."
            );

            return;

        }


        users[userIndex].password =
            newPassword;


        localStorage.setItem(
            "qissavaUsers",
            JSON.stringify(users)
        );


        localStorage.removeItem(
            "qissavaResetEmail"
        );


        alert(
            "Password successfully reset ho gaya!"
        );


        window.location.href =
            "login.html";

    }
);

</script>


</body>

</html>
