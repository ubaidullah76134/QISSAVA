<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign Up - QISSAVA</title>

    <link
        rel="stylesheet"
        href="css/S-L.css"
    >

</head>


<body>


<!-- =========================
     SIGNUP HEADER
========================= -->

<header class="signup-header">

    <a
        href="index.html"
        class="signup-back"
    >
        🔙
    </a>


    <div class="signup-header-title">
        Sign Up
    </div>

</header>



<!-- =========================
     SIGNUP
========================= -->

<main class="signup-container">


    <div class="signup-card">


        <!-- Logo -->

        <div class="signup-logo">

            <img
                src="images/qissava-logo.png"
                alt="QISSAVA"
            >

        </div>


        <h1>
            Create Account
        </h1>


        <p class="signup-subtitle">
            Join QISSAVA and share your stories.
        </p>



        <!-- Form -->

        <form
            id="signupForm"
        >


            <!-- Name -->

            <label for="signupName">
                Full Name
            </label>

            <input
                type="text"
                id="signupName"
                placeholder="Enter your name"
                autocomplete="name"
                required
            >



            <!-- Email -->

            <label for="signupEmail">
                Email
            </label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >



            <!-- Password -->

            <label for="signupPassword">
                Password
            </label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="6"
                required
            >



            <!-- Confirm Password -->

            <label for="signupConfirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="signupConfirmPassword"
                placeholder="Confirm your password"
                autocomplete="new-password"
                minlength="6"
                required
            >



            <!-- Button -->

            <button
                type="submit"
                class="signup-submit"
            >
                Create Account
            </button>


        </form>



        <!-- Login -->

        <p class="login-text">

            Already have an account?

            <a href="login.html">
    Login
</a>

        </p>


    </div>

</main>



<!-- =========================
     JAVASCRIPT
========================= -->

<script>

const signupForm =
    document.getElementById("signupForm");


signupForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const name =
            document
                .getElementById("signupName")
                .value
                .trim();


        const email =
            document
                .getElementById("signupEmail")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("signupPassword")
                .value;


        const confirmPassword =
            document
                .getElementById(
                    "signupConfirmPassword"
                )
                .value;


        /* Password check */

        if (password.length < 6) {

            alert(
                "Password must be at least 6 characters."
            );

            return;

        }


        /* Confirm password */

        if (
            password !==
            confirmPassword
        ) {

            alert(
                "Passwords do not match."
            );

            return;

        }


        /* Existing users */

        let users = [];

        try {

            users =
                JSON.parse(
                    localStorage.getItem(
                        "qissavaUsers"
                    )
                ) || [];

        } catch(error) {

            users = [];

        }


        /* Check email */

        const existingUser =
            users.find(
                function(user) {

                    return (
                        user.email ===
                        email
                    );

                }
            );


        if (existingUser) {

            alert(
                "This email is already registered."
            );

            return;

        }


        /* New user */

        const newUser = {

            id: Date.now(),

            name: name,

            email: email,

            password: password

        };


        users.push(
            newUser
        );


        localStorage.setItem(
            "qissavaUsers",
            JSON.stringify(users)
        );


        alert(
            "Account created successfully!"
        );


        window.location.href =
            "index.html";

    }
);

</script>


</body>

</html>
