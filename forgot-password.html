<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - QISSAVA</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>


<header class="forgot-header">

    <a
        href="login.html"
        class="forgot-back"
    >
        🔙
    </a>

    <div class="forgot-header-title">
        Forgot Password
    </div>

</header>



<main class="forgot-container">

    <div class="forgot-card">


        <div class="forgot-logo">

            <img
                src="images/qissava-logo.png"
                alt="QISSAVA"
            >

        </div>


        <h1>
            Reset Password
        </h1>


        <p class="forgot-subtitle">
            Enter your email address to reset your password.
        </p>



        <form id="forgotForm">


            <label for="forgotEmail">
                Email
            </label>

            <input
                type="email"
                id="forgotEmail"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >


            <button
                type="submit"
                class="forgot-submit"
            >
                Continue
            </button>

        </form>


        <p class="back-login">

            Remember your password?

            <a href="login.html">
                Login
            </a>

        </p>


    </div>

</main>



<script>

const forgotForm =
    document.getElementById("forgotForm");


forgotForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("forgotEmail")
                .value
                .trim()
                .toLowerCase();


        let users = [];

        try {

            users =
                JSON.parse(
                    localStorage.getItem(
                        "qissavaUsers"
                    )
                ) || [];

        } catch(error) {

            users = [];

        }


        const user =
            users.find(
                function(item) {

                    return item.email === email;

                }
            );


        if (!user) {

            alert(
                "Is email se koi account nahi mila."
            );

            return;

        }


        /*
         * Demo reset:
         * Email verify hone ke baad
         * reset-password.html open hoga.
         */

        localStorage.setItem(
            "qissavaResetEmail",
            email
        );


        window.location.href =
            "reset-password.html";

    }
);

</script>


</body>

</html>
